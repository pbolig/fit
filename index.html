<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitPulse - Entrenamiento & Motor Biométrico Offline-First</title>
  <meta name="description" content="Plataforma de entrenamiento físico integral con registro biométrico, cálculo científico de gasto calórico (MET), 1RM, zonas de frecuencia cardíaca y sincronización silenciosa con Supabase.">
  <meta name="theme-color" content="#080c14">

  <!-- Manifest PWA -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Google Fonts: Outfit (Athletic & Headings) + Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <div class="app-shell">
    <!-- BARRA LATERAL (DESKTOP SIDEBAR) -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">FitPulse</span>
        <span class="brand-badge">PWA</span>
      </div>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        <a href="#dashboard" class="nav-link active" id="nav-dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Inicio / Hub</span>
        </a>

        <a href="#profile" class="nav-link" id="nav-profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil Biométrico</span>
        </a>

        <a href="#workout" class="nav-link" id="nav-workout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/></svg>
          <span>Entrenar Ahora</span>
        </a>

        <a href="#history" class="nav-link" id="nav-history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Historial & Récords</span>
        </a>

        <a href="#classes" class="nav-link" id="nav-classes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Salas en Vivo</span>
        </a>

        <a href="#trainer-hub" class="nav-link" id="nav-trainer-hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Hub Entrenador</span>
        </a>

        <a href="#admin" class="nav-link" id="nav-admin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <span>Panel Superadmin</span>
        </a>

        <a href="#catalog" class="nav-link" id="nav-catalog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
          <span>Biblioteca de Ejercicios</span>
        </a>

        <a href="#settings" class="nav-link" id="nav-settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Configuración & Nube</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-pill" id="header-user-btn" title="Ver perfil biométrico">
          <div class="user-avatar-circle" id="header-user-avatar">
            <span>🏋️</span>
          </div>
          <div class="user-text-wrap">
            <span class="user-display-name" id="header-user-name">Atleta Local</span>
            <span class="user-role-label">Fase 1 Biometría</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="app-main">
      <!-- HEADER SUPERIOR -->
      <header class="app-header">
        <div class="header-left">
          <!-- Indicador de sincronización en tiempo real -->
          <div class="sync-status-badge badge-local" id="header-sync-status" title="Clic para conectar con Supabase o iniciar sesión">
            <span class="sync-dot dot-blue"></span>
            <span class="sync-text">Modo Local (Invitado)</span>
          </div>
        </div>

        <div class="header-right">
          <a href="#workout" class="btn btn-primary btn-sm btn-glow" id="header-quick-train-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Entrenar</span>
          </a>
        </div>
      </header>

      <!-- CONTENEDOR DINÁMICO DE VISTAS (SPA) -->
      <section class="view-content-wrapper" id="view-content">
        <!-- Renderizado por el Router -->
      </section>
    </main>

    <!-- BARRA DE NAVEGACIÓN MÓVIL (BOTTOM NAV) -->
    <nav class="bottom-nav" aria-label="Navegación móvil">
      <a href="#dashboard" class="bottom-nav-item active" id="bnav-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Inicio</span>
      </a>

      <a href="#profile" class="bottom-nav-item" id="bnav-profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Biometría</span>
      </a>

      <a href="#workout" class="bottom-nav-item" id="bnav-workout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/></svg>
        <span>Entrenar</span>
      </a>

      <a href="#history" class="bottom-nav-item" id="bnav-history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Récords</span>
      </a>

      <a href="#settings" class="bottom-nav-item" id="bnav-settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <!-- Script principal modular de la aplicación -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
